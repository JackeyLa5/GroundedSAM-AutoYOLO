services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autolabeling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autolabeling"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.5.1-cuda12.1-cudnn9-devel}
        TORCH_ARCH: ${TORCH_ARCH:-8.9}
        GROUNDING_MODEL_ID: ${GROUNDING_MODEL_ID:-IDEA-Research/grounding-dino-tiny}
        SAM2_MODEL_ID: ${SAM2_MODEL_ID:-facebook/sam2.1-hiera-base-plus}
        PRELOAD_MODELS: ${PRELOAD_MODELS:-1}
    image: autoyolo-backend:ubuntu-x86-cuda
    ports:
      - "8000:8000"
      - "8002:8002"
    shm_size: "8gb"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/autolabeling
      PYTHONPATH: /app
      HF_HOME: /home/appuser/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      DEVICE: cuda
      LOG_DIR: /app/logs
      WATCHFILES_FORCE_POLLING: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ../backend/app:/app/app
      - ../backend/grounded_sam2_server.py:/app/grounded_sam2_server.py
      - ../backend/alembic.ini:/app/alembic.ini
      - ../backend/alembic:/app/alembic
      - ../logs:/app/logs
      - model-cache:/app/model
      - uploads:/app/uploads
      - training-data:/app/training_runs
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: autoyolo-frontend:ubuntu-x86
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
  uploads:
  training-data:
