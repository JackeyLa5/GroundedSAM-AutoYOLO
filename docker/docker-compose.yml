services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autolabeling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autolabeling"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-dustynv/pytorch:2.1-r35.4.1}
        TORCH_ARCH: ${TORCH_ARCH:-8.7}
        GROUNDING_MODEL_ID: ${GROUNDING_MODEL_ID:-IDEA-Research/grounding-dino-tiny}
        # Keep build-time preload aligned with the verified runtime checkpoint.
        SAM2_MODEL_ID: ${SAM2_MODEL_ID:-facebook/sam2.1-hiera-small}
        PRELOAD_MODELS: ${PRELOAD_MODELS:-1}
    image: autoyolo-backend:jetson-arm64-cuda
    ports:
      - "8000:8000"
      - "8002:8002"
    shm_size: "8gb"
    # Jetson GPU device nodes are normally owned by the host's `video` group
    # (GID 44).  backend runs as appuser, so it needs this supplementary group.
    # Override JETSON_GPU_GID if `stat -c '%g' /dev/nvmap` reports another GID.
    group_add:
      - "${JETSON_GPU_GID:-44}"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/autolabeling
      PYTHONPATH: /app:/opt/Grounded-SAM-2
      HF_HOME: /home/appuser/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      DEVICE: cuda
      LOG_DIR: /app/logs
      WATCHFILES_FORCE_POLLING: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Local SAM2 checkpoint (avoids downloading from Hugging Face at runtime).
      # Must match the checkpoint's actual architecture — see docs/JETSON_DEPLOYMENT_ZH.md.
      GROUNDED_SAM2_SAM2_MODEL_ID: facebook/sam2.1-hiera-small
      GROUNDED_SAM2_SAM2_CHECKPOINT_PATH: /models/sam2/sam2.1_hiera_small.pt
    volumes:
      - ../backend/app:/app/app
      - ../backend/grounded_sam2_server.py:/app/grounded_sam2_server.py
      - ../backend/alembic.ini:/app/alembic.ini
      - ../backend/alembic:/app/alembic
      - ../logs:/app/logs
      - model-cache:/app/model
      - uploads:/app/uploads
      - training-data:/app/training_runs
      - /home/galbot/sam2/checkpoints:/models/sam2:ro
    # The Jetson deployment runs the API as a stable single worker.  `--reload`
    # is for local development and can leave a watcher parent alive while its
    # application child repeatedly crashes or reloads.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    runtime: nvidia

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: autoyolo-frontend:jetson-arm64
    ports:
      - "80:80"
    # nginx listens on IPv4; localhost may resolve to ::1 in Alpine and make
    # the inherited image health check fail even though the site is reachable.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
  uploads:
  training-data:
